<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>{{ page.title }} | {{ site.title }}</title>

<link rel="stylesheet" href="{{ site.baseurl }}/assets/css/index.css" />
<link rel="icon" type="image/x-icon" href="/favicon.ico" />

<meta property="og:title" content="{{ page.title }}" />
{% assign meta_description = page.description
     | default: page.excerpt
     | default: site.description
     | strip_html
     | normalize_whitespace
     | truncate: 160 %}
<meta property="og:description" content="{{ meta_description | escape }}" />
<meta property="og:site_name" content="{{ site.title }}" />
<meta property="og:locale" content="en_US" />

<meta name="color-scheme" content="dark light" />
<meta name="theme-color" content="#fcfcfc" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#000000" /> <!-- Old browser fallback -->
