# Site settings
title: Duskfall
description: "Dusk's digital garden with mini-essays on knowledge management, tech, and more!"
url: "https://duskfall.dev"
baseurl: ""

# Site owner info
owner: Duskfall
owner_nickname: Dusk

defaults:
  - scope:
      path: "" # Applies to all files
    values:
      layout: default
  - scope:
      type: posts
    values:
      layout: blog
      permalink: /blog/:title/

exclude:
  - README.md
  - LICENSE.md
  - LICENSE-SOURCE.md
  - LICENSE-CONTENT.md

plugins:
  - jekyll-sitemap
  - jekyll-feed

kramdown:
  footnote_link_text: "[%s]" # Make inline footnotes closer to Wikipedia's style
  footnote_backlink: "↩︎" # switch to this symbol so it doesn't appear as an emoji on mobile